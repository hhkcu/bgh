[[games]]
title = "Counter-Strike: Global Offensive"
repo = "csgo"
script_inline = '''
local exdir = extractGame(nil)
local marker = pathJoin(exdir, ".dxvk-applied")
if not fileExists(marker) then
    local dxvk = downloadFileAs(
        "https://github.com/hhkcu/bgh/releases/download/supplementary/d3dx9_43.7z",
        exdir,
        "dxvk.7z"
    )
	local dxvk2 = downloadFileAs(
        "https://github.com/hhkcu/bgh/releases/download/supplementary/x32.7z",
        exdir,
        "dxvk2.7z"
    )
	local dxvk3 = downloadFileAs(
        "https://github.com/hhkcu/bgh/releases/download/supplementary/steam_api_x32.7z",
        exdir,
        "steam.7z"
    )
	local dxvk4 = downloadFileAs(
        "https://github.com/hhkcu/bgh/releases/download/supplementary/gcpatch.7z",
        exdir,
        "econ.7z"
    )

    if dxvk:sub(1, 7) == "#Error:" or dxvk2:sub(1, 7) == "#Error:" or dxvk3:sub(1, 7) == "#Error:" or dxvk4:sub(1, 7) == "#Error:" then
        msgbox_error(dxvk .. "\nThe game might still run depending on which station you are using, but be warned.", "Patch Download Failed")
    else
        local extracted = extractArchiveTyped(dxvk, pathJoin(exdir, "bin"), nil, "7z")
		local extracted2 = extractArchiveTyped(dxvk2, pathJoin(exdir, "bin"), nil, "7z")
		local extracted3 = extractArchiveTyped(dxvk3, pathJoin(exdir, "bin"), nil, "7z")
		local extracted4 = extractArchiveTyped(dxvk4, exdir, nil, "7z")

        if extracted:sub(1, 7) == "#Error:" or extracted2:sub(1, 7) == "#Error:" or extracted3:sub(1, 7) == "#Error:" or extracted4:sub(1, 7) == "#Error:" then
            msgbox_error("Patch 1 result: "..extracted.."\nPatch 2 result: "..extracted2, "Patch Extract Failed")
        else
            deleteFile(dxvk)
			deleteFile(dxvk2)
			deleteFile(dxvk3)
			deleteFile(dxvk4)
            writeFile(marker, "ok")
        end
    end
end
mkdir(pathJoin(exdir, "bin\\steam_settings"))
writeFile(pathJoin(exdir, "bin\\steam_settings\\configs.user.ini"), string.format([==[
[user::general]
account_name=%s
ip_country=GB]==], usern))
writeFile(pathJoin(exdir, "csgo\\cfg\\listenserver.cfg"), [==[
sv_pure 0
sv_lan 1
]==])
mkdir("N:\\RPF\\AppData10\\gc")
if not fileExists("N:\\RPF\\AppData10\\gc\\init") then
	local filesToCopy = {"inventory.txt", "price_sheet.txt", "unusual_loot_lists.txt"}
	for _, v in pairs(filesToCopy) do
		local pth = pathJoin(pathJoin(exdir, "csgo_gc"), v)
		copyFile(pth, pathJoin("N:\\RPF\\AppData10\\gc", v), true)
	end
	writeFile("N:\\RPF\\AppData10\\gc\\init", "good")
end
setEnv("CSGO_GC_DATA_DIR", "N:\\RPF\\AppData10\\gc")
-- point the in-process GC at the local relay (the launcher maps
-- 127.0.0.1:27900 through the tunnel). shipped configs have it disabled
-- or lack the block, so flip it on here at install time. best-effort:
-- the game still launches untouched when anything goes wrong.
do
    local gcCfg = pathJoin(pathJoin(exdir, "csgo_gc"), "config.txt")
    if fileExists(gcCfg) then
        local ok, content = pcall(readFile, gcCfg)
        if ok and content then
            local patched = content
            local gsAt = content:find('"gc_server"', 1, true)
            if gsAt then
                local head = content:sub(1, gsAt - 1)
                local tail = content:sub(gsAt)
                local tail2, n = tail:gsub('("enabled"%s+")0(")', '%11%2', 1)
                if n > 0 then patched = head .. tail2 end
            else
                patched = content .. '\n"gc_server"\n{\n\t"enabled"\t"1"\n\t"url"\t"http://127.0.0.1:27900"\n\t"timeout"\t"3"\n}\n'
            end
            if patched ~= content then
                writeFile(gcCfg, patched)
                print_line("GC relay enabled (csgo_gc/config.txt).")
            end
        end
    end
end
pExec(pathJoin(exdir, "csgo.exe"), "-steam", exdir, false)
'''

