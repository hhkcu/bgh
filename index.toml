writeFile(pathJoin(exdir, "bin\\steam_settings\\configs.user.ini"), cfgBase)
writeFile(pathJoin(exdir, "cstrike\\cfg\\listenserver.cfg"), string.format("sv_lan 0\nhostname \"%s's Server\"\nheartbeat", usern))
pExec(pathJoin(exdir, "jqhost32.exe"), launchParams, exdir, false)
'''

