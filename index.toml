[[games]]
title = "Counter-Strike: Source"
repo = "v0erakFC"
script_inline = '''
local exdir = extractGame(nil)
local launchParams = string.format("-game cstrike -steam -insecure +sv_tags MKHost$%s +sv_lan 1", usern)

local cfgBase = readFile(pathJoin(exdir, "bin\\steam_settings\\configs.user.BASE.ini"))
