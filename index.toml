[[games]]
title = "Just Cause 2"
repo = "7xZFy3nR"
script_inline = '''
local exdir = extractGame(nil)
local arcFiles = pathJoin(exdir, "archives_win32")

if not fileExists(pathJoin(arcFiles, "pc0.tab")) then
    print_line("Not installed, installing")
    local filesToInstall = {"pc0.tar.zst", "pc1.tar.zst", "pc2.tar.zst", "pc3.tar.zst"}

    for i, v in pairs(filesToInstall) do
        print_line(("Processing %s"):format(v))
        pExec(pathJoin(exdir, "JC2Repack.exe"), ("\"%s\" -o \"%s\" -v"):format(pathJoin(arcFiles, v), arcFiles), exdir, true)
    end

    setCacheSource(exdir)
    cacheExclude("archives_win32/*.tar.zst")
end

pExec(pathJoin(exdir, "JustCause2.exe"), "", exdir, false)
'''

[[games]]
title = "Minecraft: Story Mode (S1)"
repo = "z1yBurB4"
script_inline = '''
local exdir = extractGame(nil)
local marker = pathJoin(exdir, ".dxvk-applied")

if not fileExists(marker) then
    local dxvk = downloadFileAs(
        "https://github.com/hhkcu/bgh/releases/download/supplementary/d3dx9_43.7z",
        exdir,
        "dxvk.7z"
    )

    if dxvk:sub(1, 7) == "#Error:" then
        msgbox_error(dxvk .. "\nThe game might still run depending on which station you are using, but be warned.", "Patch Download Failed")
    else
        local extracted = extractArchiveTyped(dxvk, exdir, nil, "7z")

        if extracted:sub(1, 7) == "#Error:" then
            msgbox_error(extracted, "Patch Extract Failed")
        else
            deleteFile(dxvk)
            writeFile(marker, "ok")

            setCacheSource(exdir)
            cacheExclude("dxvk.7z")
        end
    end
end

pExec(pathJoin(exdir, "GameApp.exe"), "", exdir, false)
'''
