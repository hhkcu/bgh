[[games]]
title = "Grand Theft Auto: San Andreas"
repo = "haXCfPjB"
script_inline = '''
local exdir = extractGame(nil)
local gtaDir = pathJoin(exdir, "GTA San Andreas")

if not dirExists(gtaDir) then
    print_line("Not installed, installing")
    local rzDir = pathJoin(exdir, "GTASA.rz")
    pExec(pathJoin(exdir, "rz.exe"), ("x -o %s -r -y \"%s\" *"):format(exdir, rzDir), exdir, true)
    setCacheSource(exdir)
    cacheExclude("GTASA.rz")
end

pExec(pathJoin(exdir, "GTA San Andreas\\gta_sa.exe"), "", gtaDir, false)
'''

