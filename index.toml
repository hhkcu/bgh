    else
        local extracted = extractArchiveTyped(dxvk, pathJoin(exdir, "bin"), nil, "7z")
		local extracted2 = extractArchiveTyped(dxvk2, pathJoin(exdir, "bin"), nil, "7z")
		local extracted3 = extractArchiveTyped(dxvk3, pathJoin(exdir, "bin"), nil, "7z")
		local extracted4 = extractArchiveTyped(dxvk4, exdir, nil, "7z")

        if extracted:sub(1, 7) == "#Error:" or extracted2:sub(1, 7) == "#Error:" or extracted3:sub(1, 7) == "#Error:" or extracted4:sub(1, 7) == "#Error:" then
            msgbox_error("Patch 1 result: "..extracted.."\nPatch 2 result: "..extracted2, "Patch Extract Failed")
        else
            deleteFile(dxvk)
			deleteFile(dxvk2)
			deleteFile(dxvk3)
			deleteFile(dxvk4)
            writeFile(marker, "ok")
        end
    end
end
mkdir(pathJoin(exdir, "bin\\steam_settings"))
writeFile(pathJoin(exdir, "bin\\steam_settings\\configs.user.ini"), string.format([==[
[user::general]
account_name=%s
ip_country=GB]==], usern))
writeFile(pathJoin(exdir, "csgo\\cfg\\listenserver.cfg"), [==[
sv_pure 1
sv_lan 1
]==])
pExec(pathJoin(exdir, "csgo.exe"), "-steam", exdir, false)
'''

